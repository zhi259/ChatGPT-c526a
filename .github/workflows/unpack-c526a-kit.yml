name: Unpack C526A kit

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/unpack-c526a-kit.yml'

permissions:
  contents: write

concurrency:
  group: unpack-c526a-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.UNPACK_TOKEN }}

      - name: Locate and validate ZIP
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          archives=( ./*.zip )
          if (( ${#archives[@]} == 0 )); then
            echo '::error::仓库根目录中没有找到 ZIP 文件。请将 C526A 工具包 ZIP 上传到仓库根目录。'
            exit 1
          fi
          if (( ${#archives[@]} != 1 )); then
            echo '::error::仓库根目录中找到多个 ZIP，请只保留要解压的工具包。'
            printf '  %s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          tmp="$RUNNER_TEMP/c526a-unpack"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q "$archive" -d "$tmp"
          kit="$tmp/c526a-immortalwrt-kit"
          if [[ ! -d "$kit" || ! -f "$kit/README.md" || ! -f "$kit/.config" || ! -f "$kit/scripts/apply-c526a.sh" ]]; then
            echo '::error::ZIP 内部目录结构不符合预期；需要包含 c526a-immortalwrt-kit/README.md、.config 和 scripts/apply-c526a.sh。'
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "kit=$kit" >> "$GITHUB_OUTPUT"

      - name: Extract kit and remove obsolete v9 files
        shell: bash
        env:
          KIT_DIR: ${{ steps.archive.outputs.kit }}
        run: |
          set -Eeuo pipefail
          cp -a "$KIT_DIR/." .
          # The v9 unpack workflow copied files but did not delete omitted files.
          # Remove only explicitly retired components so they are not left in GitHub.
          rm -f \
            rootfs-overlay/www/luci-static/resources/view/status/include/29_c526a_traffic.js \
            rootfs-overlay/usr/libexec/rpcd/luci.c526a_traffic \
            scripts/patch-temp-widget.py
          rm -rf package/luci-app-c526a-wizard
          echo '解压后的仓库文件：'
          find . -maxdepth 5 -type f \
            ! -path './.git/*' \
            | sort | sed -n '1,200p'

      - name: Commit extracted files
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '没有新的解压文件需要提交。'
            exit 0
          fi
          git commit -m 'Update C526A v10 build kit'
          git push origin "HEAD:${BRANCH_NAME}"

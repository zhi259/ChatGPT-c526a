name: Unpack C526A kit

on:
  # 手动运行也可以，适合 ZIP 已经上传、但之前没有触发工作流的情况。
  workflow_dispatch:
  # 上传/更新 ZIP 后自动解压。
  push:
    paths:
      - '*.zip'
      - '.github/workflows/unpack-c526a-kit.yml'

permissions:
  contents: write

concurrency:
  group: unpack-c526a-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # 需要更新 ZIP 内的 build-c526a.yml，所以用带有 Workflows: write 权限的 PAT。
          token: ${{ secrets.UNPACK_TOKEN }}

      - name: Locate and validate ZIP
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          archives=( ./*.zip )
          if (( ${#archives[@]} == 0 )); then
            echo '::error::仓库根目录中没有找到 ZIP 文件。请将 C526A 工具包 ZIP 上传到仓库根目录。'
            exit 1
          fi
          if (( ${#archives[@]} != 1 )); then
            printf '::error::仓库根目录中找到多个 ZIP，请只保留要解压的工具包。\n'
            printf '  %s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          tmp="$RUNNER_TEMP/c526a-unpack"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q "$archive" -d "$tmp"

          kit="$tmp/c526a-immortalwrt-kit"
          if [[ ! -d "$kit" || ! -f "$kit/README.md" || ! -f "$kit/.config" || ! -f "$kit/scripts/apply-c526a.sh" ]]; then
            echo '::error::ZIP 内部目录结构不符合预期；需要包含 c526a-immortalwrt-kit/README.md、.config 和 scripts/apply-c526a.sh。'
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "kit=$kit" >> "$GITHUB_OUTPUT"

      - name: Extract kit files into repository root
        shell: bash
        env:
          KIT_DIR: ${{ steps.archive.outputs.kit }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -Eeuo pipefail
          # ZIP 顶层目录下的内容展平到仓库根目录，不会多套一层目录。
          cp -a "$KIT_DIR/." .
          # 保留原 ZIP；这样由本工作流提交解压结果时，不会因删除 ZIP 再触发一次解压工作流。
          echo '解压后的仓库文件：'
          find . -maxdepth 4 -type f \
            ! -path './.git/*' \
            ! -path './.github/workflows/unpack-c526a-kit.yml' \
            | sort | sed -n '1,160p'

      - name: Commit extracted files
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '没有新的解压文件需要提交。'
            exit 0
          fi
          git commit -m 'Add extracted C526A ImmortalWrt build kit'
          git push origin "HEAD:${BRANCH_NAME}"
